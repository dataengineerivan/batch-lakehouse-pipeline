# One file runs the whole pipeline:
# MySQL (source) -> PySpark (bronze/silver Delta Lake) -> PostgreSQL (warehouse)
# -> dbt (gold marts) -> Superset (dashboards), all scheduled by Airflow.

x-airflow-common: &airflow-common
  build: ./docker/airflow
  image: lakehouse-airflow:latest
  env_file: .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    MYSQL_HOST: mysql
    POSTGRES_HOST: postgres
    LAKEHOUSE_PATH: /opt/lakehouse
    DBT_PROFILES_DIR: /opt/dbt
  volumes:
    - ./dags:/opt/airflow/dags
    - ./jobs:/opt/jobs
    - ./scripts:/opt/scripts
    - ./dbt:/opt/dbt
    - ./lakehouse:/opt/lakehouse
    - ivy-cache:/home/airflow/.ivy2   # keeps downloaded Spark jars between runs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.4
    env_file: .env
    ports: ["3306:3306"]
    volumes:
      - ./init/mysql:/docker-entrypoint-initdb.d
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 10

  postgres:
    image: postgres:16
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - ./init/postgres:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username $${AIRFLOW_ADMIN_USER} --password $${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  superset:
    build: ./docker/superset
    image: lakehouse-superset:latest
    env_file: .env
    ports: ["8088:8088"]
    volumes:
      - superset-data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  mysql-data:
  postgres-data:
  superset-data:
  ivy-cache:
